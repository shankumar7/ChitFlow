name: Release

# Publishes a GitHub Release whenever a version tag such as v1.1.0 is pushed.
# The release notes are taken from the matching section of CHANGELOG.md.
on:
  push:
    tags:
      - 'v*'
  # Lets you publish from the Actions tab without pushing a tag by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, for example v1.1.0'
        required: true
        default: 'v1.1.0'

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${TAG}" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "ChitFlow ${TAG}" \
            --notes-file RELEASE_NOTES.md

  # Optional: attaches an Android APK built with EAS. It only runs when an EXPO_TOKEN
  # repository secret exists, so the release above works without it.
  android_apk:
    needs: release
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: env.EXPO_TOKEN != ''
        run: npm ci --legacy-peer-deps
      - name: Build APK with EAS
        if: env.EXPO_TOKEN != ''
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive --wait --json > build.json
          node -e "const b=JSON.parse(require('fs').readFileSync('build.json','utf8'));console.log(b[0].artifacts.buildUrl)" > apk_url.txt
          curl -L "$(cat apk_url.txt)" -o "ChitFlow-${TAG}.apk"
      - name: Attach APK to the release
        if: env.EXPO_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "ChitFlow-${TAG}.apk"
