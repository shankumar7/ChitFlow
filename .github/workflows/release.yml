name: Release

# Publishes a GitHub Release whenever a version tag such as v1.1.0 is pushed.
# The release notes are taken from the matching section of CHANGELOG.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ChitFlow ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag

  # Optional: attaches an Android APK built with EAS. It only runs when an EXPO_TOKEN
  # repository secret exists, so the release above works without it.
  android_apk:
    needs: release
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: env.EXPO_TOKEN != ''
        run: npm ci --legacy-peer-deps
      - name: Build APK with EAS
        if: env.EXPO_TOKEN != ''
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive --wait --json > build.json
          node -e "const b=JSON.parse(require('fs').readFileSync('build.json','utf8'));console.log(b[0].artifacts.buildUrl)" > apk_url.txt
          curl -L "$(cat apk_url.txt)" -o "ChitFlow-${GITHUB_REF_NAME}.apk"
      - name: Attach APK to the release
        if: env.EXPO_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "ChitFlow-${GITHUB_REF_NAME}.apk"
